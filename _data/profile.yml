short_bio: >-
  <p>
    I am a Ph.D. student at McGill University and Mila – Quebec AI Institute, co-advised by Prof. Doina Precup and Prof. Xiao-Wen Chang. My research focuses on continual reinforcement learning, aiming to develop AI systems that can learn and adapt in non-stationary environments. I am also a Board Member of ContinualAI, a nonprofit organization advancing research in continual learning. I co-organize the <strong>Mila Tea Talk</strong>, a weekly seminar series at Mila.
  </p>
  <p>
    Previously, I received my M.Sc. in Electrical and Computer Engineering from McGill University, and I hold a B.Sc. in Electrical and Computer Engineering, with a Minor in Mathematics, from the University of Alberta.
  </p>


