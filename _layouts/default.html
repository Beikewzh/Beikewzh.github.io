<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} - {{ site.data.profile.navbar_name }}</title>
    <meta name="description" content="{{ site.data.profile.primary_name }} — Ph.D. student at McGill University and Mila, working on continual reinforcement learning.">
    <meta property="og:title" content="{{ page.title }} - {{ site.data.profile.navbar_name }}">

<body>

</html>
