{% assign publications = include.publications %}
<section class="section">
    <h2 class="section-label">
        <span>{% if include.title %}{{ include.title }}{% else %}Selected Publications{% endif %}</span>
        <a class="more-link" href="{{ 'publications' | relative_url }}">All publications &rarr;</a>
    </h2>
    {% for item in publications limit:include.limit %}
        {% include widgets/publication_item.html item=item %}
    {% endfor %}
</section>
