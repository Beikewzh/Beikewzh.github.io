<header class="site-header">
    <div class="container{% if page.wide %} container-wide{% endif %}">
        <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.navbar_name }}</a>
        <nav class="site-nav">
            {% for item in site.data.navigation.pages %}
            <a {% if item.name == page.navbar_title %}class="active"{% endif %} href="{{ item.url | relative_url }}">{{ item.name }}</a>
            {% endfor %}
        </nav>
    </div>
</header>
